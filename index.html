<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>免費名片辨識器</title>
  <link rel="stylesheet" href="styles.css?v=4.3.5" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <div class="language-switcher" role="group" aria-label="介面語言">
        <button type="button" class="language-flag" data-language="zh-TW" aria-label="繁體中文" title="繁體中文"><svg viewBox="0 0 48 32" aria-hidden="true"><rect width="48" height="32" fill="#e00000"/><rect width="24" height="16" fill="#000095"/><circle cx="12" cy="8" r="4.2" fill="#fff"/></svg></button>
        <button type="button" class="language-flag" data-language="ko" aria-label="한국어" title="한국어"><svg viewBox="0 0 48 32" aria-hidden="true"><rect width="48" height="32" fill="#fff"/><path d="M24 10a6 6 0 0 1 0 12 3 3 0 0 0 0-6 3 3 0 0 1 0-6z" fill="#cd2e3a"/><path d="M24 22a6 6 0 0 1 0-12 3 3 0 0 0 0 6 3 3 0 0 1 0 6z" fill="#0047a0"/></svg></button>
        <button type="button" class="language-flag" data-language="en" aria-label="English" title="English"><svg viewBox="0 0 48 32" aria-hidden="true"><rect width="48" height="32" fill="#fff"/><g fill="#b22234"><rect y="0" width="48" height="3"/><rect y="6" width="48" height="3"/><rect y="12" width="48" height="3"/><rect y="18" width="48" height="3"/><rect y="24" width="48" height="3"/><rect y="30" width="48" height="2"/></g><rect width="21" height="17" fill="#3c3b6e"/></svg></button>
        <button type="button" class="language-flag" data-language="ja" aria-label="日本語" title="日本語"><svg viewBox="0 0 48 32" aria-hidden="true"><rect width="48" height="32" fill="#fff"/><circle cx="24" cy="16" r="8" fill="#bc002d"/></svg></button>
      </div>
    </div>
    <section class="hero">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">100% 免費・瀏覽器本機 OCR</p>
        <h1 data-i18n="title">名片掃描 → Excel</h1>
        <p class="sub" data-i18n="subtitle">上傳多張名片，辨識中／英／韓文字，人工確認後匯出 Excel。</p>
      </div>
      <div class="privacy" data-i18n="privacy">🔒 圖片不會上傳到本網站伺服器</div>
    </section>

    <section class="panel">
      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept="image/*" multiple />
        <strong data-i18n="dropTitle">點擊或拖曳名片圖片到這裡</strong>
        <span data-i18n="dropHint">支援 JPG、PNG、WEBP，可一次選多張</span>
      </label>

      <div class="controls">
        <label>
          <span data-i18n="ocrLanguage">OCR 語言</span>
          <select id="language">
            <option value="chi_tra+eng+kor">繁中＋英文＋韓文</option>
            <option value="chi_tra+eng">繁中＋英文</option>
            <option value="kor+eng">韓文＋英文</option>
            <option value="eng">英文</option>
          </select>
        </label>
        <button id="scanBtn" class="primary" disabled data-i18n="scan">開始辨識</button>
        <button id="exportBtn" disabled data-i18n="export">匯出 Excel</button>
        <button id="clearBtn" disabled data-i18n="clear">清空</button>
      </div>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-head">
          <span id="progressText" data-i18n="ready">準備中</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>

      <div id="previewList" class="preview-list"></div>
    </section>

    <section class="panel table-panel">
      <div class="table-head">
        <div>
          <h2 data-i18n="resultsTitle">辨識結果</h2>
          <p data-i18n="resultsHint">OCR 不會永遠乖巧，匯出前請快速校對。</p>
        </div>
        <span id="countBadge" class="badge">0 筆</span>
      </div>

      <div class="table-wrap">
        <table id="resultTable">
          <thead>
            <tr>
              <th class="column-filename" data-i18n="filename">檔名</th>
              <th class="column-name" data-i18n="name">姓名</th>
              <th class="column-mobile" data-i18n="mobile">手機</th>
              <th class="column-phone" data-i18n="phone">電話</th>
              <th class="column-fax" data-i18n="fax">傳真</th>
              <th data-i18n="email">郵箱</th>
              <th data-i18n="company">公司</th>
              <th data-i18n="department">部門</th>
              <th data-i18n="titleCol">職位</th>
              <th data-i18n="companyEnglish">公司英文名字</th>
              <th data-i18n="website">網址</th>
              <th data-i18n="postalCode">郵遞區號</th>
              <th class="column-address" data-i18n="address">地址</th>
              <th data-i18n="rawText">原始辨識文字</th>
              <th data-i18n="actions"></th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr class="empty-row"><td colspan="15" data-i18n="empty">尚未辨識名片</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer data-i18n="footer">
      第一次辨識某個語言時，瀏覽器需要下載免費 OCR 語言模型，可能稍等一會兒。
    </footer>
  </main>

  <div id="catCursor" class="cat-cursor" aria-hidden="true">
    <span class="toe toe-1"></span>
    <span class="toe toe-2"></span>
    <span class="toe toe-3"></span>
    <span class="toe toe-4"></span>
    <span class="paw-pad"></span>
  </div>

  <script src="app.js?v=4.3.5"></script>
</body>
</html>
